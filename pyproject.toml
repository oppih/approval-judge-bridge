[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "approval-judge-bridge"
version = "1.0.0"
description = "OpenAI-compatible judge endpoint (Jev, any LLM, or rules) for agent approval gates"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "oppih" }]
keywords = ["agent", "approvals", "guardrails", "jev", "typesafe", "safety"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/oppih/approval-judge-bridge"

[project.scripts]
approval-judge-bridge = "judge_bridge.server:main"

[tool.setuptools]
packages = ["judge_bridge"]
